services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender123
      POSTGRES_DB: tender_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tender_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 注意：Aspose.Words 仅提供 Linux x86_64 whl。
  # Apple Silicon（Colima/arm64）请用 scripts/dev_mac.sh 在宿主机跑后端。
  # x86_64 Linux 服务器可用：docker compose --profile linux-backend up -d
  backend:
    profiles: ["linux-backend"]
    build: ./backend
    platform: linux/amd64
    environment:
      DATABASE_URL: postgresql://tender:tender123@db:5432/tender_agent
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: tender-agent
      SAMPLE_DATA_DIR: /app/sample_data
      CORS_ORIGINS: "*"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      ASPOSE_LICENSE_PATH: /aspose/Aspose.License.txt
      CUSTOMER_DATA_DIR: /app/customer_data/heyuanzhineng_20260729
      PREFER_CUSTOMER_PACK: "true"
    volumes:
      - ./sample_data:/app/sample_data:ro
      - ./customer_data:/app/customer_data:ro
      - "./docs/Aspose.Words for Python  Developer OEM证书/Word究极工具/aspose-words:/aspose:ro"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
